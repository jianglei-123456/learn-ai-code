spring:
  ai:
    deepseek:
      api-key: 1
      chat:
        options:
          model: deepseek-v4-flash
  application:
    name: langchain4j-samples
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  mvc:
    contentnegotiation:
      favor-parameter: true
server:
  port: 19998

logging:
  charset:
    console: UTF-8
  level:
    dev.langchain4j: DEBUG

langchain4j:
  open-ai:
    chat-model:
      log-requests: true
      log-responses: true
